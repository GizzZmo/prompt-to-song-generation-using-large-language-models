name: Documentation Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check README exists
      run: |
        if [ ! -f README.md ]; then
          echo "README.md not found!"
          exit 1
        fi
        echo "README.md found ✓"
    
    - name: Check for broken links in README
      run: |
        # Basic check for markdown links
        if grep -q '\[.*\](' README.md; then
          echo "Links found in README ✓"
        fi
    
    - name: Validate markdown files
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/workflows/markdown-link-check-config.json'
        check-modified-files-only: 'yes'
      continue-on-error: true
    
    - name: Check documentation completeness
      run: |
        echo "Checking for essential documentation sections..."
        sections=("Methodology" "How to Run" "Installation" "Requirements")
        for section in "${sections[@]}"; do
          if grep -qi "$section" README.md; then
            echo "✓ Found section: $section"
          else
            echo "⚠ Missing or unclear section: $section"
          fi
        done
